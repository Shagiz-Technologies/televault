name: Finalize ARMv7 release verifier

on:
  pull_request:
    branches: [main]
    paths:
      - "tool/android/finalize_armv7_verifier.py"
      - ".github/workflows/finalize-armv7-verifier.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-armv7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply ABI-specific release verification
        run: python3 tool/android/finalize_armv7_verifier.py

      - name: Run verifier unit tests
        run: python3 -m unittest tool.android.test_verify_16kb -v

      - name: Commit finalized verifier
        shell: bash
        run: |
          set -euo pipefail
          rm tool/android/finalize_armv7_verifier.py
          rm .github/workflows/finalize-armv7-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Build]: Enforce ABI-specific native alignment;"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            git push origin "HEAD:${{ github.ref_name }}"
          fi
