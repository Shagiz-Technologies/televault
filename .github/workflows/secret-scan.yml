name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tool_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' |
            sha256sum --check -
          tar --extract --gzip --file "$archive" gitleaks
          chmod 0755 gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan Git history
        run: >-
          gitleaks git .
          --redact
          --no-banner
          --no-color
          --verbose

      - name: Scan checked-out files
        run: >-
          gitleaks dir .
          --redact
          --no-banner
          --no-color
          --verbose
