name: Feature request
description: Propose a user problem for maintainer discussion.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem, not an implementation. Architecture,
        permissions, encryption, login, sync, restore, storage-format, native
        binary, and dependency changes require maintainer agreement before work
        begins.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, what are they trying to do, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or experience without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: dropdown
    id: sensitive_area
    attributes:
      label: Sensitive areas affected
      multiple: true
      options:
        - None known
        - Architecture
        - Android permissions
        - Encryption or vault
        - Telegram login or sessions
        - Sync or upload
        - Restore or metadata backup
        - Storage or database format
        - Native binaries
        - Dependencies or supply chain
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Explain data access, storage, transmission, permissions, and user-control changes. Use "none known" when appropriate.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: android_validation
    attributes:
      label: Android validation needs
      description: List relevant Android versions, devices, network states, media-library sizes, or accessibility conditions.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Contribution agreement
      options:
        - label: I will wait for maintainer agreement before implementing changes to architecture, permissions, encryption, login, sync, restore, storage formats, native binaries, or dependencies.
          required: true
        - label: I have not included private account, media, credential, session, backup, database, signing, or log data.
          required: true
